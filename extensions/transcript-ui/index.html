<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transcript</title>
<style>
  /* Single clean editor: FCP-inspector styling over the /api/editor slice
     model (revision-checked cards). No legacy story-lines UI remains. */
  :root {
    color-scheme: dark;
    --bg: #1e1e1e;        /* FCP inspector canvas */
    --row: #2a2a2c;       /* inspector row */
    --row2: #262628;      /* card body */
    --line: #38383a;      /* hairlines */
    --txt: #e5e5e6;
    --dim: #9a9aa0;
    --faint: #636366;
    --acc: #5e5ce6;       /* FCP inspector toggle blue */
    --acc-soft: rgba(94, 92, 230, .16);
    --danger: #ff453a;
    --warn: #ffd60a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--txt);
    font: 13px/1.45 -apple-system, Helvetica, Arial, sans-serif;
    margin: 0; padding: 0;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* ---- top bar: search only (title row removed as redundant) ---- */
  header {
    flex: none;
    background: #2a2a2c; border-bottom: 1px solid #101012;
    padding: 10px 12px;
  }
  #search {
    width: 100%; background: #101012; border: 1px solid var(--line);
    border-radius: 8px; color: var(--txt); font: inherit;
    padding: 5px 10px; outline: none;
  }
  #search:focus { border-color: var(--acc); }
  #search::placeholder { color: var(--faint); }
  .iconbtn {
    background: none; border: 1px solid transparent; border-radius: 6px;
    color: var(--dim); font-size: 14px; padding: 4px 8px; cursor: pointer;
    flex: none;
  }
  .iconbtn:hover { color: var(--txt); background: #38383a; }
  .iconbtn:disabled { opacity: .35; cursor: default; background: none; }
  /* ---- status strip: one quiet line, like an inspector footnote ---- */
  #status {
    flex: none;
    display: flex; align-items: center; gap: 7px;
    padding: 7px 16px; font-size: 12px; color: var(--dim);
    border-bottom: 1px solid var(--line);
  }
  #status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
  #status.ok .dot { background: var(--acc); }
  #status.warn .dot { background: var(--warn); }
  #status .msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* ---- banners ---- */
  #err, #note { display: none; margin: 10px 12px 0; padding: 8px 12px; font-size: 12px; flex: none; }
  #err {
    display: none; border-radius: 8px; background: #2a1214; color: #ff9d97;
    border: 1px solid #5a2c2c; white-space: pre-wrap;
  }
  #note {
    border-radius: 8px; background: var(--acc-soft); color: #c7c5ff;
    border: 1px solid rgba(94, 92, 230, .4);
  }
  /* ---- cards as inspector sections, scrolling in their own region ---- */
  #list {
    list-style: none; margin: 0; padding: 0;
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, .16) transparent;
  }
  /* Minimal floating-style thumb nested inside the list (not the window edge).
     True auto-hide follows the macOS "Show scroll bars" setting; this keeps
     the thumb as quiet as CSS allows until hover. */
  #list::-webkit-scrollbar { width: 10px; }
  #list::-webkit-scrollbar-track { background: transparent; }
  #list::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, .14);
    border-radius: 5px;
    border: 3px solid transparent;
    background-clip: content-box;
  }
  #list::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, .28); background-clip: content-box; border: 3px solid transparent; }
  #list li {
    background: var(--row); border-bottom: 1px solid #101012;
    margin: 0; padding: 0;
  }
  #list li.dragover-top { box-shadow: inset 0 2px 0 var(--acc); }
  #list li.dragover-bottom { box-shadow: inset 0 -2px 0 var(--acc); }
  #list li.preview { opacity: .55; }
  .cardhead {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px 6px; font-size: 12px; color: var(--dim);
    user-select: none; -webkit-user-select: none;
  }
  .grip {
    cursor: grab; color: var(--faint); font-size: 12px; letter-spacing: 1px;
    padding: 2px 4px; flex: none;
  }
  .grip:hover { color: var(--txt); }
  .tc { font-variant-numeric: tabular-nums; }
  .dur { margin-left: auto; color: var(--faint); font-variant-numeric: tabular-nums; }
  .del {
    background: none; border: none; color: var(--faint); font-size: 13px;
    cursor: pointer; padding: 2px 6px; border-radius: 6px; flex: none;
  }
  .del:hover { color: var(--danger); background: #38383a; }
  .del:disabled { opacity: .3; cursor: default; background: none; }
  .del svg { display: block; }
  .cardbody {
    margin: 0 12px 12px; background: var(--row2);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; font-size: 14px; line-height: 1.55;
    outline: none; overflow-wrap: anywhere;
  }
  .cardbody:focus { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc); }
  .cardbody.locked { opacity: .6; }
  /* ---- waiting view ---- */
  #waiting {
    display: none; flex: 1 1 auto; min-height: 0; overflow-y: auto;
    text-align: center; padding: 56px 28px; color: var(--dim);
  }
  #waiting .glyph { font-size: 34px; margin-bottom: 12px; }
  #waiting h2 { font-size: 13px; font-weight: 600; color: var(--txt); margin: 0 0 6px; }
  #waiting p { font-size: 12px; margin: 4px 0; }
  #waiting code {
    display: inline-block; background: #101012; border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 8px; font-size: 12px; color: var(--txt);
  }
  footer {
    flex: none;
    background: #2a2a2c; border-top: 1px solid #101012;
    color: var(--faint); font-size: 11px; padding: 6px 8px 6px 16px;
    display: flex; gap: 8px; align-items: center;
  }
  footer .keys { margin-left: auto; white-space: nowrap; }
  footer .iconbtn {
    font-size: 13px; padding: 3px 8px; margin-left: 2px;
    color: var(--faint);
  }
  footer .iconbtn:hover { color: var(--txt); background: #38383a; }
</style>
<header>
  <input id="search" type="search" placeholder="Search transcript" autocomplete="off">
</header>
<div id="status"><span class="dot"></span><span class="msg" id="statusmsg">Connecting…</span></div>
<div id="err"></div>
<div id="note"></div>
<div id="waiting">
  <div class="glyph">▦</div>
  <h2 id="waittitle">Waiting for timeline</h2>
  <p id="waitmsg">Open Final Cut Pro and transcribe first.</p>
  <p>Service: <code>make ui</code> · panel: <code>Window &gt; Transcript</code></p>
</div>
<ol id="list"></ol>
<footer><span id="counts"></span><span class="keys">↵ split&ensp;·&ensp;⌫ trim&ensp;·&ensp;drag to reorder</span><button class="iconbtn" id="refresh" title="Refresh from Final Cut Pro (⌘R)">↻</button></footer>
<script>
'use strict';
/* Slice-model editor (the one clean path): GET /api/editor snapshot,
   POST /api/editor/edit intents. Revision-checked like the native cards:
   Enter splits after the word under the caret, Delete trims selected words,
   drag on the grip reorders. Typing new words is refused (recorded speech
   can only be cut). */
const $ = s => document.querySelector(s);
const list = $('#list'), errBox = $('#err'), noteBox = $('#note'),
      statusEl = $('#status'), statusMsg = $('#statusmsg'),
      waiting = $('#waiting'), counts = $('#counts');

let snap = null;            // latest snapshot
let selectedID = null;
let busy = false, needsRefresh = false, dragging = false;
let previewOrder = null;    // optimistic ids while a move is in flight
let search = '';

function showErr(e) {
  if (!e) { errBox.style.display = 'none'; errBox.textContent = ''; return; }
  errBox.style.display = 'block';
  errBox.textContent = typeof e === 'string' ? e : JSON.stringify(e, null, 1).slice(0, 600);
}
function flashNote(s) {
  noteBox.style.display = 'block'; noteBox.textContent = s;
  clearTimeout(flashNote.t); flashNote.t = setTimeout(() => noteBox.style.display = 'none', 4500);
}
function setStatus(kind, msg) {
  statusEl.className = kind || '';
  statusMsg.textContent = msg;
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  return r.json();
}
function rows() {
  const base = (snap && snap.slices) || [];
  if (previewOrder) {
    const byID = Object.fromEntries(base.map(s => [s.id, s]));
    return previewOrder.map(id => byID[id]).filter(Boolean);
  }
  return base;
}
function filtered() {
  const r = rows();
  if (!search) return r;
  const q = search.toLowerCase();
  return r.filter(s => s.text.toLowerCase().includes(q));
}
function canEdit() {
  return !busy && !needsRefresh && snap && !snap.edit_error;
}
function tc(v) {
  const s = Math.max(0, Math.floor(v));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function applySnapshot(story) {
  snap = story;
  previewOrder = null;
  if (!story.slices.some(s => s.id === selectedID))
    selectedID = (story.slices[0] || {}).id || null;
  render();
}

async function refresh() {
  if (busy) return;
  busy = true; showErr(null);
  try {
    const [st, ed] = await Promise.all([api('/api/status'), api('/api/editor')]);
    if (ed && ed.ok === false) {
      // No transcript / bridge down: waiting view carries the reason.
      snap = null;
      setStatus('warn', (st && st.bridge_error) ? 'Bridge unreachable — launch patched FCP' : 'No transcript yet');
      $('#waitmsg').textContent = ed.error || 'Transcribe in FCP first.';
      render();
    } else {
      if (st && !st.bridge_error) setStatus('ok', 'Up to date with Final Cut Pro');
      else setStatus('warn', 'Bridge unreachable — launch patched FCP');
      if (ed.edit_error) $('#waitmsg').textContent = ed.edit_error;
      needsRefresh = false;
      applySnapshot(ed);
    }
  } catch (e) {
    setStatus('warn', 'Service unreachable — run make ui');
    snap = null;
    $('#waitmsg').textContent = 'Could not reach the timeline service.';
    render();
  }
  busy = false;
  render(); // re-render unlocked: applySnapshot above rendered while busy
}

async function syncIfIdle() {
  if (busy || dragging || needsRefresh || !snap || document.hidden) return;
  const rev = snap.revision;
  try {
    const fresh = await api('/api/editor');
    if (busy || dragging || !snap || snap.revision !== rev) return;
    if (fresh && fresh.ok !== false && fresh.revision !== rev) applySnapshot(fresh);
  } catch (e) { /* transient: next tick reports */ }
}

async function send(intent) {
  // Attach identity anchors so the server can rebase or refuse stale cards.
  intent.revision = snap.revision;
  intent.timeline = snap.timeline;
  const src = snap.slices.find(s => s.id === intent.id);
  if (src) intent.source_words = src.words.map(w => w.i);
  if (intent.before_id) {
    const anchor = snap.slices.find(s => s.id === intent.before_id);
    if (anchor) intent.anchor_words = anchor.words.map(w => w.i);
  }
  busy = true; showErr(null);
  setStatus('', 'Saving to Final Cut…');
  try {
    const res = await api('/api/editor/edit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(intent),
    });
    if (res.story) applySnapshot(res.story);
    if (res.code === 'stale' && res.story) {
      needsRefresh = false;
      flashNote('Updated from Final Cut Pro — that card changed.');
    } else if (res.ok && res.story) {
      needsRefresh = false;
      setStatus('ok', 'Edit confirmed in Final Cut Pro');
    } else {
      needsRefresh = true;
      showErr(res.error || 'Final Cut did not confirm the edit. Refresh before continuing.');
      setStatus('warn', 'Check timeline · refresh');
      render();
    }
    } catch (e) {
    needsRefresh = true;
    showErr('The edit could not be confirmed. Refresh before retrying. ' + e.message);
    setStatus('warn', 'Check timeline · refresh');
  }
  busy = false;
  render(); // re-render unlocked: applySnapshot above rendered while busy
}

/* ---- caret → word mapping (whole-word on any intersection, like native) ---- */
function wordAtPoint(editable, node, offset, after) {
  // Returns the word index to split AFTER (after=true) or the span layout.
  const slice = sliceOf(editable);
  if (!slice) return null;
  const spans = [...editable.querySelectorAll('span[data-i]')];
  const textBefore = (target, off) => {
    // Visible char count from editable start to (target node, off).
    let n = 0;
    const walker = document.createTreeWalker(editable, NodeFilter.SHOW_TEXT);
    let t;
    while ((t = walker.nextNode())) {
      if (t === target) return n + off;
      n += t.textContent.length;
    }
    return n;
  };
  const pos = textBefore(node, offset);
  // Layout: word k occupies [off, off+len), one space between words.
  let cursor = 0, prev = null;
  for (const sp of spans) {
    const wi = +sp.dataset.i, len = sp.textContent.length;
    if (after) {
      // Caret strictly inside/after word start belongs to it; caret at the
      // very first char belongs to the previous word (split before).
      if (pos > cursor) prev = wi;
      else break;
    }
    cursor += len + 1;
  }
  if (!after) return { pos, spans };
  return prev;
}
function sliceOf(editable) {
  const li = editable.closest('li');
  if (!li || !snap) return null;
  return snap.slices.find(s => s.id === li.dataset.id) || null;
}
function selectedWordIDs(editable) {
  // Whole word included on any selection intersection (native parity).
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || !editable.contains(sel.anchorNode)) return [];
  const range = sel.getRangeAt(0);
  const out = [];
  for (const sp of editable.querySelectorAll('span[data-i]')) {
    const r = document.createRange();
    r.selectNodeContents(sp);
    if (range.compareBoundaryPoints(Range.END_TO_START, r) < 0 &&
        range.compareBoundaryPoints(Range.START_TO_END, r) > 0)
      out.push(+sp.dataset.i);
  }
  return out;
}
function wordBeforeCaret(editable) {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || !editable.contains(sel.anchorNode)) return null;
  const range = sel.getRangeAt(0);
  if (!range.collapsed) return null;
  return wordAtPoint(editable, range.startContainer, range.startOffset, true);
}
function wordAfterCaret(editable) {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || !editable.contains(sel.anchorNode)) return null;
  const range = sel.getRangeAt(0);
  if (!range.collapsed) return null;
  const slice = sliceOf(editable);
  if (!slice) return null;
  const ids = slice.words.map(w => w.i);
  const before = wordAtPoint(editable, range.startContainer, range.startOffset, true);
  if (before == null) return ids[0] || null;
  const k = ids.indexOf(before);
  return (k >= 0 && k + 1 < ids.length) ? ids[k + 1] : null;
}

/* ---- render ---- */
function render() {
  list.innerHTML = '';
  const showWaiting = !snap;
  waiting.style.display = showWaiting ? 'block' : 'none';
  if (!snap) {
    counts.textContent = '';
    return; // status + waiting reason already set by refresh()
  }
  if (snap.edit_error) {
    showErr(snap.edit_error);
    waiting.style.display = 'block';
    $('#waittitle').textContent = 'Timeline not editable';
    $('#waitmsg').textContent = snap.edit_error;
  } else {
    $('#waittitle').textContent = 'Waiting for timeline';
  }
  const locked = !canEdit();
  for (const s of filtered()) {
    const li = document.createElement('li');
    li.dataset.id = s.id;
    if (previewOrder && previewOrder[0] !== undefined && !rows().some(r => r.id === s.id)) continue;

    const head = document.createElement('div');
    head.className = 'cardhead';
    const grip = document.createElement('span');
    grip.className = 'grip'; grip.title = 'Drag to reorder'; grip.textContent = '⋮⋮';
    grip.addEventListener('mousedown', () => { li.draggable = !search && canEdit(); });
    grip.addEventListener('mouseup', () => { li.draggable = false; });
    const t = document.createElement('span');
    t.className = 'tc'; t.textContent = tc(s.start);
    const d = document.createElement('span');
    d.className = 'dur'; d.textContent = (s.end - s.start).toFixed(1) + 's';
    const del = document.createElement('button');
    del.className = 'del'; del.title = 'Delete slice';
    del.setAttribute('aria-label', 'Delete slice');
    // Monochrome line glyph (FCP-inspector mood), not emoji.
    del.innerHTML = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" ' +
      'stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M2.5 4h11M6.5 4V2.8c0-.4.3-.8.8-.8h1.4c.4 0 .8.4.8.8V4"/>' +
      '<path d="M4 4l.7 9.2c.1.4.4.8.9.8h4.8c.5 0 .8-.4.9-.8L12 4M6.8 7v4M9.2 7v4"/></svg>';
    del.disabled = locked;
    del.addEventListener('click', () => {
      if (!canEdit()) return;
      selectedID = s.id;
      send({ action: 'delete', id: s.id });
    });
    head.append(grip, t, d, del);

    const body = document.createElement('div');
    body.className = 'cardbody' + (locked ? ' locked' : '');
    body.contentEditable = locked ? 'false' : 'true';
    body.spellcheck = false;
    s.words.forEach((w, k) => {
      const sp = document.createElement('span');
      sp.dataset.i = w.i; sp.textContent = w.w;
      body.appendChild(sp);
      if (k < s.words.length - 1) body.appendChild(document.createTextNode(' '));
    });
    body.addEventListener('focus', () => { selectedID = s.id; });
    body.addEventListener('keydown', ev => {
      if (!canEdit()) return;
      selectedID = s.id;
      if (ev.key === 'Enter') {
        ev.preventDefault();
        const after = collapsedSplitWord(body);
        if (after == null) { showErr('Split after a word before the end of the slice.'); return; }
        send({ action: 'split', id: s.id, words: [after] });
      } else if (ev.key === 'Backspace' || ev.key === 'Delete') {
        ev.preventDefault();
        let ids = selectedWordIDs(body);
        if (!ids.length) {
          const single = ev.key === 'Backspace' ? wordBeforeCaret(body) : wordAfterCaret(body);
          if (single == null) return;
          ids = [single];
        }
        send({ action: 'trim', id: s.id, words: ids });
      }
    });
    body.addEventListener('beforeinput', ev => {
      // Recorded speech cuts only: refuse inserts; cut-to-clipboard becomes a trim.
      if (ev.inputType === 'insertFromDrop') { ev.preventDefault(); return; }
      if (ev.inputType.startsWith('insert')) {
        ev.preventDefault();
        flashNote('Select words and press Delete to trim recorded speech. Enter splits a card.');
      } else if (ev.inputType === 'deleteByCut') {
        ev.preventDefault();
        const ids = selectedWordIDs(body);
        if (ids.length && canEdit()) send({ action: 'trim', id: s.id, words: ids });
      }
    });
    // Drag reorder (grip-initiated; disabled while filtered).
    li.addEventListener('dragstart', ev => {
      if (search || !canEdit()) { ev.preventDefault(); return; }
      dragging = true;
      ev.dataTransfer.setData('text/plain', s.id);
      ev.dataTransfer.effectAllowed = 'move';
    });
    li.addEventListener('dragend', () => {
      dragging = false; li.draggable = false;
      list.querySelectorAll('.dragover-top,.dragover-bottom')
        .forEach(el => el.classList.remove('dragover-top', 'dragover-bottom'));
    });
    li.addEventListener('dragover', ev => {
      if (!dragging) return;
      ev.preventDefault();
      const rect = li.getBoundingClientRect();
      const after = (ev.clientY - rect.top) > rect.height / 2;
      li.classList.toggle('dragover-top', !after);
      li.classList.toggle('dragover-bottom', after);
    });
    li.addEventListener('dragleave', () =>
      li.classList.remove('dragover-top', 'dragover-bottom'));
    li.addEventListener('drop', ev => {
      ev.preventDefault();
      li.classList.remove('dragover-top', 'dragover-bottom');
      onDrop(ev, s.id);
    });

    li.append(head, body);
    list.appendChild(li);
  }
  const n = rows().length;
  counts.textContent = busy ? 'Saving to Final Cut…'
    : needsRefresh ? 'Check timeline · refresh'
    : n + ' slices · ' + tc((snap && snap.duration) || 0);
  $('#refresh').disabled = busy;
}

function collapsedSplitWord(editable) {
  // Word to split AFTER for a collapsed caret (null = refuse).
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || !editable.contains(sel.anchorNode)) return null;
  const range = sel.getRangeAt(0);
  if (!range.collapsed) return null;
  const slice = sliceOf(editable);
  if (!slice) return null;
  const ids = slice.words.map(w => w.i);
  const after = wordAtPoint(editable, range.startContainer, range.startOffset, true);
  if (after == null || after === ids[ids.length - 1]) return null;
  return after;
}

async function onDrop(ev, targetId) {
  const srcId = ev.dataTransfer.getData('text/plain');
  dragging = false;
  if (!srcId || srcId === targetId || !canEdit() || search) return;
  const ids = rows().map(s => s.id).filter(id => id !== srcId);
  // Insertion side was marked during dragover; recompute from drop coords.
  const li = list.querySelector(`li[data-id="${CSS.escape(targetId)}"]`);
  let before = targetId;
  if (li) {
    const r = li.getBoundingClientRect();
    if ((ev.clientY - r.top) > r.height / 2) {
      const order = rows().map(s => s.id);
      const k = order.indexOf(targetId);
      before = (k >= 0 && k + 1 < order.length) ? order[k + 1] : null;
    }
  }
  const at = before ? ids.indexOf(before) : ids.length;
  ids.splice(at < 0 ? ids.length : at, 0, srcId);
  previewOrder = ids;
  render();
  await send({ action: 'move', id: srcId, before_id: before });
}

/* ---- wiring ---- */
$('#refresh').addEventListener('click', refresh);
document.addEventListener('keydown', ev => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'r') { ev.preventDefault(); refresh(); }
});
$('#search').addEventListener('input', ev => { search = ev.target.value; render(); });
setInterval(syncIfIdle, 2000);
refresh();
</script>
</html>
